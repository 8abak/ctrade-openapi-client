    uses: ./.github/workflows/fresh-xauusd-v5-recovery-terminal-adoption.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
    with:
      launch_run_id: "30132173254"
      launch_run_attempt: "1"
      launch_commit_sha: "72784c36b00223ca166b3f0d904ab4c93db7dcc1"
      launch_artifact_id: "8611513967"
