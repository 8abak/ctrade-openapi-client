name: Fresh XAUUSD chronological research

on:
  push:
    branches:
      - codex/xauusd-fresh-walkforward
    paths:
      - .github/research-launch.txt
  workflow_dispatch:

concurrency:
  group: fresh-xauusd-research
  cancel-in-progress: false

jobs:
  research:
    name: Run sealed chronological study on EC2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out frozen research code
        uses: actions/checkout@v4

      - name: Verify frozen research launch identity
        shell: bash
        env:
          FRESH_GITHUB_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          expected_ref="refs/heads/codex/xauusd-fresh-walkforward"
          expected_marker="fresh-xauusd-run-2026-07-23-v18-v4-bounded-storage"
          if [[ "${FRESH_GITHUB_REF}" != "${expected_ref}" ]]; then
            printf 'refusing research run from unexpected ref: %s\n' \
              "${FRESH_GITHUB_REF}" >&2
            exit 1
          fi
          if ! cmp -s -- .github/research-launch.txt \
            <(printf '%s\n' "${expected_marker}"); then
            printf 'refusing research run with an unexpected launch marker\n' >&2
            exit 1
          fi

      - name: Download the immutable terminal run-17 artifact
        uses: actions/download-artifact@v4
        with:
          name: fresh-xauusd-30000411128-1
          path: ${{ runner.temp }}/fresh-xauusd-run17
          github-token: ${{ github.token }}
          run-id: 30000411128

      - name: Verify the immutable terminal run-17 archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/fresh-xauusd-run17/fresh-xauusd-30000411128-1.tgz"
          expected="13f3c091ecb54d58f1d467d9ce0022617658f80a1a7fa38f4c78c33a9c865ada"
          [[ -f "${archive}" && ! -L "${archive}" ]]
          actual="$(sha256sum -- "${archive}" | awk '{print $1}')"
          if [[ "${actual}" != "${expected}" ]]; then
            printf 'terminal run-17 archive digest changed\n' >&2
            exit 1
          fi

      - name: Run the frozen study on the data host
        id: remote
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          FRESH_BRANCH: ${{ github.ref_name }}
          FRESH_SHA: ${{ github.sha }}
          FRESH_RUN_ID: ${{ github.run_id }}
          FRESH_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN17_ARCHIVE: ${{ runner.temp }}/fresh-xauusd-run17/fresh-xauusd-30000411128-1.tgz
        run: |
          set -uo pipefail
          umask 077
          key_path="${RUNNER_TEMP}/fresh-research-key"
          archive_name="fresh-xauusd-${FRESH_RUN_ID}-${FRESH_RUN_ATTEMPT}.tgz"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          ssh_options=(
            -i "${key_path}"
            -p "${EC2_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          scp_options=(
            -i "${key_path}"
            -P "${EC2_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
          )

          transfer_directory="$({
            ssh "${ssh_options[@]}" "${EC2_USER}@${EC2_HOST}" \
              'umask 077; mktemp -d /tmp/fresh-xauusd-transfer.XXXXXX'
          } | tr -d '\r')"
          case "${transfer_directory}" in
            /tmp/fresh-xauusd-transfer.*)
              ;;
            *)
              printf 'refusing unexpected remote transfer directory: %s\n' \
                "${transfer_directory}" >&2
              rm -f "${key_path}"
              exit 1
              ;;
          esac
          archive_remote="${transfer_directory}/${archive_name}"
          restart_archive_remote="${transfer_directory}/run17-restart.tgz"

          if ! scp "${scp_options[@]}" \
            "${RUN17_ARCHIVE}" \
            "${EC2_USER}@${EC2_HOST}:${restart_archive_remote}"; then
            rm -f "${key_path}"
            exit 1
          fi

          set +e
          ssh "${ssh_options[@]}" "${EC2_USER}@${EC2_HOST}" \
            bash -s -- \
            "${FRESH_BRANCH}" \
            "${FRESH_SHA}" \
            "${FRESH_RUN_ID}" \
            "${FRESH_RUN_ATTEMPT}" \
            "${restart_archive_remote}" \
            "${archive_remote}" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          branch="$1"
          sha="$2"
          run_id="$3"
          attempt="$4"
          restart_archive="$5"
          archive="$6"
          transfer_directory="$(dirname -- "${restart_archive}")"
          production_repo="/home/ec2-user/cTrade"

          if [[ "$(dirname -- "${archive}")" != "${transfer_directory}" ||
            -L "${transfer_directory}" || ! -d "${transfer_directory}" ]]; then
            printf 'remote transfer paths are not in one real directory\n' >&2
            exit 1
          fi
          transfer_resolved="$(readlink -f -- "${transfer_directory}")"
          case "${transfer_resolved}" in
            /tmp/fresh-xauusd-transfer.*)
              ;;
            *)
              printf 'refusing unexpected transfer directory: %s\n' \
                "${transfer_resolved}" >&2
              exit 1
              ;;
          esac

          remove_scoped_directory() {
            candidate="$1"
            [[ -d "${candidate}" ]] || return 0
            resolved="$(readlink -f -- "${candidate}")"
            case "${resolved}" in
              /tmp/fresh-xauusd-worktree.*|/tmp/fresh-xauusd-output.*|/tmp/fresh-xauusd-restart.*|/tmp/fresh-xauusd-transfer.*)
                rm -rf -- "${resolved}"
                ;;
              *)
                printf 'refusing unscoped directory cleanup: %s\n' "${resolved}" >&2
                return 1
                ;;
            esac
          }

          remove_scoped_file() {
            candidate="$1"
            [[ -f "${candidate}" ]] || return 0
            resolved="$(readlink -f -- "${candidate}")"
            case "${resolved}" in
              /tmp/fresh-xauusd-run.*.log|/tmp/fresh-xauusd-*.tgz)
                rm -f -- "${resolved}"
                ;;
              *)
                printf 'refusing unscoped file cleanup: %s\n' "${resolved}" >&2
                return 1
                ;;
            esac
          }

          while IFS= read -r registered_worktree; do
            case "${registered_worktree}" in
              /tmp/fresh-xauusd-worktree.*)
                git -C "${production_repo}" worktree remove --force \
                  "${registered_worktree}" || \
                  remove_scoped_directory "${registered_worktree}"
                ;;
            esac
          done < <(
            git -C "${production_repo}" worktree list --porcelain |
              sed -n 's/^worktree //p'
          )
          git -C "${production_repo}" worktree prune
          shopt -s nullglob
          for stale_directory in \
            /tmp/fresh-xauusd-worktree.* \
            /tmp/fresh-xauusd-output.* \
            /tmp/fresh-xauusd-restart.* \
            /tmp/fresh-xauusd-transfer.*; do
            if [[ "$(readlink -f -- "${stale_directory}")" ==
              "${transfer_resolved}" ]]; then
              continue
            fi
            remove_scoped_directory "${stale_directory}"
          done
          for stale_file in \
            /tmp/fresh-xauusd-run.*.log \
            /tmp/fresh-xauusd-*.tgz; do
            if [[ "${stale_file}" == "${restart_archive}" ]]; then
              continue
            fi
            remove_scoped_file "${stale_file}"
          done
          shopt -u nullglob

          worktree="$(mktemp -d /tmp/fresh-xauusd-worktree.XXXXXX)"
          output="$(mktemp -d /tmp/fresh-xauusd-output.XXXXXX)"
          log_path="$(mktemp /tmp/fresh-xauusd-run.XXXXXX.log)"
          restart_directory="$(mktemp -d /tmp/fresh-xauusd-restart.XXXXXX)"
          durable_state_root="/home/ec2-user/.local/state/datavis/fresh-xauusd-research-v2"
          scratch_root="/home/ec2-user/.local/state/datavis/fresh-xauusd-scratch-v1"
          scratch=""
          scratch_owner_value="fresh-xauusd-scratch-owner-v1:${run_id}:${attempt}:${sha}"

          python3 - "${restart_archive}" "${restart_directory}" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1]).resolve()
          destination = pathlib.Path(sys.argv[2]).resolve()
          expected_archive = "13f3c091ecb54d58f1d467d9ce0022617658f80a1a7fa38f4c78c33a9c865ada"
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          if digest.hexdigest() != expected_archive:
              raise SystemExit("remote terminal run-17 archive digest changed")
          allowed = {
              "fresh_corpus_manifest_v1.json",
              "fresh_entry_bank_v1.json",
              "fresh_experiment_ledger_v1.jsonl",
              "fresh_implementation_manifest_v1.json",
              "fresh_preregistration_v3.json",
              "fresh_quantile_bank_v1.json",
              "fresh_research_state_binding_v2.json",
              "fresh_source_inventory_v1.json",
              "fresh_split_manifest_v2.json",
              "fresh_threshold_domain_preflight_v1.json",
              "predecessor_fresh_experiment_ledger_v1.jsonl",
              "predecessor_fresh_implementation_manifest_v1.json",
              "predecessor_fresh_preregistration_v2.json",
              "predecessor_fresh_research_state_binding_v1.json",
              "remote-exit-status.txt",
              "server-run.log",
          }
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              normalized = []
              root_directory_seen = False
              for member in members:
                  if member.name == ".":
                      if root_directory_seen or not member.isdir():
                          raise SystemExit("unsafe run-17 archive root member")
                      root_directory_seen = True
                      continue
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  if (
                      not name
                      or name in {".", ".."}
                      or not member.isfile()
                      or name != pathlib.PurePosixPath(name).name
                  ):
                      raise SystemExit("unsafe run-17 archive member")
                  normalized.append((name, member))
              names = [name for name, _ in normalized]
              if not root_directory_seen:
                  raise SystemExit("run-17 archive root member changed")
              if set(names) != allowed or len(names) != len(allowed):
                  raise SystemExit("run-17 archive member set changed")
              for name, member in normalized:
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit("run-17 archive member is unreadable")
                  target = destination / name
                  descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(descriptor, "wb") as output:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          output.write(chunk)
                      output.flush()
                      os.fsync(output.fileno())
          PY
          if [[ -L "${durable_state_root}" ]]; then
            printf 'refusing symlink durable research state root\n' >&2
            exit 1
          fi
          mkdir -p -- "${durable_state_root}"
          if [[ ! -d "${durable_state_root}" || -L "${durable_state_root}" ]]; then
            printf 'durable research state root is not a directory\n' >&2
            exit 1
          fi
          chmod 700 -- "${durable_state_root}"
          durable_state_root_resolved="$(readlink -f -- "${durable_state_root}")"
          if [[ -z "${durable_state_root_resolved}" ]]; then
            printf 'could not resolve durable research state root\n' >&2
            exit 1
          fi
          case "${durable_state_root_resolved}" in
            /tmp|/tmp/*)
              printf 'durable research state root resolved under /tmp\n' >&2
              exit 1
              ;;
          esac

          binding_value() {
            binding_path="$1"
            binding_key="$2"
            python3 - "${binding_path}" "${binding_key}" <<'PY'
          import json
          import os
          import sys

          binding_path, binding_key = sys.argv[1:]
          with open(binding_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          value = payload.get(binding_key)
          if (
              not isinstance(value, str)
              or not value
              or not os.path.isabs(value)
              or any(character in value for character in "\x00\r\n")
          ):
              raise SystemExit(f"invalid {binding_key} in research state binding")
          sys.stdout.write(value)
          PY
          }

          snapshot_state_file() {
            source_path="$1"
            destination_name="$2"
            destination_path="${output}/${destination_name}"
            resolved_source="$(readlink -f -- "${source_path}")" || {
              printf 'could not resolve durable state source: %s\n' \
                "${source_path}" >&2
              return 1
            }
            case "${resolved_source}" in
              "${durable_state_root_resolved}"/*)
                ;;
              *)
                printf 'refusing state source outside durable root: %s\n' \
                  "${resolved_source}" >&2
                return 1
                ;;
            esac
            if [[ ! -e "${source_path}" && ! -L "${source_path}" ]]; then
              return 0
            fi
            if [[ ! -f "${resolved_source}" ]]; then
              printf 'durable state source is not a regular file: %s\n' \
                "${resolved_source}" >&2
              return 1
            fi
            if [[ -L "${destination_path}" ]]; then
              printf 'refusing symlink snapshot destination: %s\n' \
                "${destination_path}" >&2
              return 1
            fi
            if [[ -e "${destination_path}" ]]; then
              if [[ ! -f "${destination_path}" ]]; then
                printf 'snapshot destination is not a regular file: %s\n' \
                  "${destination_path}" >&2
                return 1
              fi
              return 0
            fi
            cp --no-clobber -- "${resolved_source}" "${destination_path}"
          }

          snapshot_durable_research_state() {
            binding_path="${output}/fresh_research_state_binding_v3.json"
            if [[ -L "${binding_path}" ]]; then
              printf 'refusing symlink research state binding: %s\n' \
                "${binding_path}" >&2
              return 1
            fi
            if [[ -e "${binding_path}" && ! -f "${binding_path}" ]]; then
              printf 'research state binding is not a regular file: %s\n' \
                "${binding_path}" >&2
              return 1
            fi
            [[ -f "${binding_path}" ]] || return 0
            ledger_source="$(
              binding_value "${binding_path}" experimentLedgerPath
            )" || return 1
            holdout_source="$(
              binding_value "${binding_path}" holdoutAuthorizationRegistryPath
            )" || return 1
            snapshot_state_file \
              "${ledger_source}" fresh_experiment_ledger_v1.jsonl || return 1
            snapshot_state_file \
              "${holdout_source}" fresh_holdout_authorization_v1.json || return 1
          }

          remove_scoped_scratch() {
            candidate="$1"
            [[ -n "${candidate}" ]] || return 0
            if [[ -L "${candidate}" || ! -d "${candidate}" ]]; then
              printf 'refusing unexpected scratch path: %s\n' "${candidate}" >&2
              return 1
            fi
            candidate_resolved="$(readlink -f -- "${candidate}")" || return 1
            scratch_parent="$(dirname -- "${candidate_resolved}")"
            scratch_name="$(basename -- "${candidate_resolved}")"
            if [[ "${scratch_parent}" != "${scratch_root_resolved}" ]]; then
              printf 'refusing scratch outside scoped root: %s\n' \
                "${candidate_resolved}" >&2
              return 1
            fi
            case "${scratch_name}" in
              "run.${run_id}.${attempt}."*)
                ;;
              *)
                printf 'refusing scratch with unexpected name: %s\n' \
                  "${candidate_resolved}" >&2
                return 1
                ;;
            esac
            owner_path="${scratch_root_resolved}/.${scratch_name}.owner"
            if [[ -L "${owner_path}" || ! -f "${owner_path}" ]] ||
              ! cmp -s -- "${owner_path}" \
                <(printf '%s\n' "${scratch_owner_value}"); then
              printf 'refusing scratch without exact ownership marker: %s\n' \
                "${candidate_resolved}" >&2
              return 1
            fi
            rm -rf -- "${candidate_resolved}"
            rm -f -- "${owner_path}"
          }

          remove_stale_scoped_scratch() {
            candidate="$1"
            if [[ -L "${candidate}" || ! -d "${candidate}" ]]; then
              printf 'refusing unexpected stale scratch path: %s\n' \
                "${candidate}" >&2
              return 1
            fi
            candidate_resolved="$(readlink -f -- "${candidate}")" || return 1
            scratch_parent="$(dirname -- "${candidate_resolved}")"
            scratch_name="$(basename -- "${candidate_resolved}")"
            if [[ "${scratch_parent}" != "${scratch_root_resolved}" ||
              ! "${scratch_name}" =~ ^run\.([0-9]+)\.([0-9]+)\.([A-Za-z0-9]{6})$ ]]; then
              printf 'refusing unscoped stale scratch: %s\n' \
                "${candidate_resolved}" >&2
              return 1
            fi
            stale_run_id="${BASH_REMATCH[1]}"
            stale_attempt="${BASH_REMATCH[2]}"
            owner_path="${scratch_root_resolved}/.${scratch_name}.owner"
            if [[ -L "${owner_path}" || ! -f "${owner_path}" ]]; then
              printf 'refusing stale scratch without owner marker: %s\n' \
                "${candidate_resolved}" >&2
              return 1
            fi
            owner_value="$(<"${owner_path}")"
            if [[ ! "${owner_value}" =~ ^fresh-xauusd-scratch-owner-v1:${stale_run_id}:${stale_attempt}:[0-9a-f]{40}$ ]]; then
              printf 'refusing stale scratch with invalid owner marker: %s\n' \
                "${candidate_resolved}" >&2
              return 1
            fi
            while IFS= read -r process_line; do
              if [[ " ${process_line} " ==
                *" --scratch-dir ${candidate_resolved} "* ]]; then
                printf 'refusing to remove scratch used by a live process: %s\n' \
                  "${candidate_resolved}" >&2
                return 1
              fi
            done < <(pgrep -af 'datavis[.]research[.]fresh_pipeline_cli' || true)
            rm -rf -- "${candidate_resolved}"
            rm -f -- "${owner_path}"
          }

          finalize() {
            status="$?"
            trap - EXIT
            set +e
            if [[ -f "${log_path}" ]]; then
              cp "${log_path}" "${output}/server-run.log"
            fi
            shopt -s nullglob
            for snapshot_temporary in \
              "${output}"/.fresh-snapshot-*.tmp; do
              if [[ ! -f "${snapshot_temporary}" || -L "${snapshot_temporary}" ]]; then
                printf 'refusing unexpected snapshot temporary: %s\n' \
                  "${snapshot_temporary}" >&2
                status=1
                continue
              fi
              rm -f -- "${snapshot_temporary}"
            done
            output_resolved="$(readlink -f -- "${output}")"
            for spool_directory in \
              "${output}"/.fresh-entry-spool-*; do
              if [[ -L "${spool_directory}" || ! -d "${spool_directory}" ]]; then
                printf 'refusing unexpected spool path: %s\n' \
                  "${spool_directory}" >&2
                status=1
                continue
              fi
              spool_resolved="$(readlink -f -- "${spool_directory}")"
              case "${spool_resolved}" in
                "${output_resolved}"/.fresh-entry-spool-*)
                  rm -rf -- "${spool_resolved}"
                  ;;
                *)
                  printf 'refusing unscoped spool cleanup: %s\n' \
                    "${spool_resolved}" >&2
                  status=1
                  ;;
              esac
            done
            shopt -u nullglob
            if ! remove_scoped_scratch "${scratch}"; then
              status=1
            fi
            if ! snapshot_durable_research_state; then
              printf 'failed to snapshot durable research state\n' >&2
              status=1
            fi
            printf '%s\n' "${status}" > "${output}/remote-exit-status.txt"
            archive_temporary="${archive}.partial"
            archive_ok=0
            rm -f -- "${archive_temporary}"
            if tar -czf "${archive_temporary}" -C "${output}" . &&
              [[ -f "${archive_temporary}" && ! -L "${archive_temporary}" ]] &&
              tar -tzf "${archive_temporary}" >/dev/null &&
              sha256sum -- "${archive_temporary}" >/dev/null &&
              mv -- "${archive_temporary}" "${archive}" &&
              [[ -f "${archive}" && ! -L "${archive}" ]] &&
              tar -tzf "${archive}" >/dev/null; then
              archive_ok=1
            fi
            if [[ "${archive_ok}" -ne 1 ]]; then
              printf '%s\n' \
                'failed to create and verify research archive; preserving recovery state' \
                >&2
              exit 1
            fi
            cd /tmp
            git -C "${production_repo}" worktree remove --force \
              "${worktree}" || remove_scoped_directory "${worktree}"
            git -C "${production_repo}" worktree prune
            remove_scoped_directory "${output}"
            remove_scoped_directory "${restart_directory}"
            remove_scoped_file "${log_path}"
            exit "${status}"
          }
          trap finalize EXIT

          if [[ -L "${scratch_root}" ]]; then
            printf 'refusing symlink research scratch root\n' >&2
            exit 1
          fi
          mkdir -p -- "${scratch_root}"
          chmod 700 -- "${scratch_root}"
          if [[ ! -d "${scratch_root}" || -L "${scratch_root}" ]]; then
            printf 'research scratch root is not a real directory\n' >&2
            exit 1
          fi
          scratch_root_resolved="$(readlink -f -- "${scratch_root}")"
          if [[ -z "${scratch_root_resolved}" ||
            "${scratch_root_resolved}" == "${durable_state_root_resolved}" ]]; then
            printf 'research scratch root overlaps durable state\n' >&2
            exit 1
          fi
          case "${scratch_root_resolved}" in
            /tmp|/tmp/*|"${durable_state_root_resolved}"/*)
              printf 'research scratch root has an unsafe location\n' >&2
              exit 1
              ;;
          esac
          shopt -s nullglob
          for stale_scratch in "${scratch_root_resolved}"/run.*.*.*; do
            remove_stale_scoped_scratch "${stale_scratch}"
          done
          shopt -u nullglob
          scratch="$(
            mktemp -d \
              "${scratch_root_resolved}/run.${run_id}.${attempt}.XXXXXX"
          )"
          scratch_resolved="$(readlink -f -- "${scratch}")"
          if [[ "$(dirname -- "${scratch_resolved}")" !=
            "${scratch_root_resolved}" || -L "${scratch}" ]]; then
            printf 'allocated research scratch escaped its scoped root\n' >&2
            exit 1
          fi
          scratch_name="$(basename -- "${scratch_resolved}")"
          scratch_owner_path="${scratch_root_resolved}/.${scratch_name}.owner"
          if ! (
            set -o noclobber
            printf '%s\n' "${scratch_owner_value}" > "${scratch_owner_path}"
          ); then
            printf 'could not create exclusive scratch ownership marker\n' >&2
            exit 1
          fi
          chmod 600 -- "${scratch_owner_path}"
          scratch_free_bytes="$(
            df --output=avail -B1 -- "${scratch_resolved}" |
              awk 'NR == 2 {print $1}'
          )"
          scratch_free_inodes="$(
            df --output=iavail -- "${scratch_resolved}" |
              awk 'NR == 2 {print $1}'
          )"
          minimum_scratch_free_bytes="$((12 * 1024 * 1024 * 1024))"
          minimum_scratch_free_inodes=4096
          if [[ ! "${scratch_free_bytes}" =~ ^[0-9]+$ ||
            "${scratch_free_bytes}" -lt "${minimum_scratch_free_bytes}" ]]; then
            printf 'research scratch has insufficient free bytes: %s\n' \
              "${scratch_free_bytes}" >&2
            exit 1
          fi
          if [[ ! "${scratch_free_inodes}" =~ ^[0-9]+$ ||
            "${scratch_free_inodes}" -lt "${minimum_scratch_free_inodes}" ]]; then
            printf 'research scratch has insufficient free inodes: %s\n' \
              "${scratch_free_inodes}" >&2
            exit 1
          fi

          cd "${production_repo}"
          git fetch origin "${branch}"
          git worktree add --detach "${worktree}" "${sha}"
          cd "${worktree}"
          set -a
          eval "$(sudo cat /etc/datavis.env)"
          set +a

          research_venv="${worktree}/.fresh-venv"
          python3 -m venv "${research_venv}"
          research_python="${research_venv}/bin/python"
          "${research_python}" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            numpy==2.0.2 \
            pandas==2.2.3 \
            psycopg2-binary==2.9.10 \
            python-dotenv==1.1.1
          "${research_python}" -c 'import numpy, pandas, psycopg2, dotenv'
          fresh_test_modules=()
          for test_path in test_fresh_*.py; do
            fresh_test_modules+=("${test_path%.py}")
          done
          "${research_python}" -m unittest "${fresh_test_modules[@]}"

          set +e
          "${research_python}" -m datavis.research.fresh_pipeline_cli \
            --repository-root "${worktree}" \
            --output-dir "${output}" \
            --scratch-dir "${scratch_resolved}" \
            --research-state-dir "${durable_state_root}" \
            --restart-v4-artifact-dir "${restart_directory}" \
            --execute 2>&1 | tee "${log_path}"
          research_status="${PIPESTATUS[0]}"
          set -e
          exit "${research_status}"
          REMOTE
          research_status=$?

          scp "${scp_options[@]}" \
            "${EC2_USER}@${EC2_HOST}:${archive_remote}" \
            "${archive_name}"
          scp_status=$?
          cleanup_status=0
          if [[ "${scp_status}" -eq 0 ]]; then
            ssh "${ssh_options[@]}" "${EC2_USER}@${EC2_HOST}" \
              bash -s -- "${transfer_directory}" <<'CLEANUP' || cleanup_status=$?
          set -Eeuo pipefail
          candidate="$1"
          if [[ -L "${candidate}" || ! -d "${candidate}" ]]; then
            printf 'refusing unexpected completed transfer directory: %s\n' \
              "${candidate}" >&2
            exit 1
          fi
          resolved="$(readlink -f -- "${candidate}")"
          case "${resolved}" in
            /tmp/fresh-xauusd-transfer.*)
              rm -rf -- "${resolved}"
              ;;
            *)
              printf 'refusing unscoped completed transfer cleanup: %s\n' \
                "${resolved}" >&2
              exit 1
              ;;
          esac
          CLEANUP
          fi
          rm -f "${key_path}"
          echo "archive=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "remote_archive=${archive_remote}" >> "${GITHUB_OUTPUT}"
          if [[ "${scp_status}" -ne 0 ]]; then
            exit "${scp_status}"
          fi
          if [[ "${cleanup_status}" -ne 0 ]]; then
            exit "${cleanup_status}"
          fi
          exit "${research_status}"

      - name: Upload immutable research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-xauusd-${{ github.run_id }}-${{ github.run_attempt }}
          path: fresh-xauusd-${{ github.run_id }}-${{ github.run_attempt }}.tgz
          if-no-files-found: error
          retention-days: 30
