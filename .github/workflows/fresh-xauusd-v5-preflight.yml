name: Fresh XAUUSD v5 detached preflight

on:
  push:
    branches:
      - codex/xauusd-fresh-walkforward
    paths:
      - .github/research-v5-preflight.txt

concurrency:
  group: fresh-xauusd-v5-detached-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate v5 code and detached lifecycle controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out proposed frozen code
        uses: actions/checkout@v4

      - name: Check out exact scientific launch runtime
        uses: actions/checkout@v4
        with:
          ref: bc7c814876cc75a0fbe85ba824177ad8baccd5cf
          path: frozen-launch-source
          persist-credentials: false

      - name: Verify preflight identity
        shell: bash
        env:
          FRESH_GITHUB_REF: ${{ github.ref }}
          FRESH_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          expected_ref="refs/heads/codex/xauusd-fresh-walkforward"
          expected_marker="fresh-xauusd-v5-lifecycle-preflight-2026-07-24-r7"
          [[ "${FRESH_GITHUB_REF}" == "${expected_ref}" ]]
          [[ "$(git rev-parse HEAD)" == "${FRESH_GITHUB_SHA}" ]]
          cmp -s -- .github/research-v5-preflight.txt \
            <(printf '%s\n' "${expected_marker}")
          printf '%s  %s\n' \
            "bd08194866bc817555b7b25e9d30634c8d0912e4fff74f55e81be516e1a1fa0c" \
            "datavis/research/fresh_terminal_audit_bootstrap.py" |
            sha256sum --check --strict -
          bash -n -- .github/scripts/fresh-xauusd-v5-controller.sh
          workflow_steps=(
            ".github/workflows/fresh-xauusd-v5-detached-launch.yml|Launch detached v5 controller and obtain immutable receipt"
            ".github/workflows/fresh-xauusd-v5-read-only-monitor.yml|Verify frozen monitor identity"
            ".github/workflows/fresh-xauusd-v5-read-only-monitor.yml|Verify and extract immutable launch receipt artifact"
            ".github/workflows/fresh-xauusd-v5-read-only-monitor.yml|Capture strictly read-only remote metadata"
            ".github/workflows/fresh-xauusd-v5-read-only-monitor.yml|Seal immutable outcome-blind monitor receipt"
            ".github/workflows/fresh-xauusd-v5-terminal-adoption.yml|Verify frozen adoption trigger identity"
            ".github/workflows/fresh-xauusd-v5-terminal-adoption.yml|Verify immutable launch run and artifact metadata"
            ".github/workflows/fresh-xauusd-v5-terminal-adoption.yml|Validate launch receipt and its controller source"
            ".github/workflows/fresh-xauusd-v5-terminal-adoption.yml|Read terminal receipt and stream its exact archive"
          )
          index=0
          for specification in "${workflow_steps[@]}"; do
            workflow="${specification%%|*}"
            step="${specification#*|}"
            extracted="${RUNNER_TEMP}/fresh-v5-step-${index}.sh"
            python3 -B .github/scripts/extract_workflow_run.py \
              "${workflow}" "${step}" > "${extracted}"
            bash -n -- "${extracted}"
            index="$((index + 1))"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned research test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            numpy==2.0.2 \
            pandas==2.2.3 \
            psycopg2-binary==2.9.10 \
            python-dotenv==1.1.1 \
            ruff==0.12.2

      - name: Compile and test the frozen research stack
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            datavis/research/fresh_restart_v5.py \
            datavis/research/fresh_preregistration.py \
            datavis/research/fresh_pipeline.py \
            datavis/research/fresh_pipeline_cli.py \
            .github/scripts/fresh-xauusd-v5-monitor-controller.py \
            .github/scripts/fresh-xauusd-v5-remote-monitor.py \
            .github/scripts/fresh-xauusd-v5-terminal-reader.py
          printf '%s\n' \
            "fresh-xauusd-v5-read-only-monitor-source-30067832187-attempt-1-r2" \
            > .github/research-v5-monitor.txt
          printf '%s\n' \
            "fresh-xauusd-v5-terminal-adoption-30067832187-1-r2" \
            > .github/research-v5-adoption-launch.txt
          fresh_test_modules=()
          for test_path in test_fresh_*.py; do
            case "${test_path}" in
              test_fresh_terminal_audit.py|test_fresh_terminal_audit_bootstrap.py)
                continue
                ;;
            esac
            fresh_test_modules+=("${test_path%.py}")
          done
          python -m unittest -v "${fresh_test_modules[@]}"

      - name: Validate sealed auditor against exact launch runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          frozen_root="${GITHUB_WORKSPACE}/frozen-launch-source"
          [[ "$(git -C "${frozen_root}" rev-parse HEAD)" == \
            "bc7c814876cc75a0fbe85ba824177ad8baccd5cf" ]]
          files=(
            "datavis/research/fresh_terminal_audit.py"
            "datavis/research/fresh_terminal_audit_bootstrap.py"
            "test_fresh_terminal_audit.py"
            "test_fresh_terminal_audit_bootstrap.py"
          )
          for relative in "${files[@]}"; do
            [[ ! -e "${frozen_root}/${relative}" ]]
            cp --no-clobber -- "${GITHUB_WORKSPACE}/${relative}" \
              "${frozen_root}/${relative}"
          done
          (
            cd "${frozen_root}"
            printf '%s  %s\n' \
              "ec9c3791fd7da33a495623021463f39dc332150c5880d2742a3fc18847e7ad00" \
              "datavis/research/fresh_terminal_audit.py" \
              "bd08194866bc817555b7b25e9d30634c8d0912e4fff74f55e81be516e1a1fa0c" \
              "datavis/research/fresh_terminal_audit_bootstrap.py" \
              "dafaf04f16d3001f8053dea67655459551bd37671391363af5be59f13af15663" \
              "test_fresh_terminal_audit.py" \
              "0583c0b9a914f2d810d775ecc45b0a0593fb96170dd342a0ab0d9a170da4784b" \
              "test_fresh_terminal_audit_bootstrap.py" |
              sha256sum --check --strict -
            python -m py_compile "${files[@]}"
            python -m unittest -v \
              test_fresh_terminal_audit \
              test_fresh_terminal_audit_bootstrap
            python -m ruff check "${files[@]}"
          )

      - name: Exercise the sealed audit bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          frozen_root="${GITHUB_WORKSPACE}/frozen-launch-source"
          probe="${RUNNER_TEMP}/fresh-v5-bootstrap-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "${probe}" ]]
          status=0
          set +e
          output="$(
            python -I -B \
              "${frozen_root}/datavis/research/fresh_terminal_audit_bootstrap.py" \
              "${probe}" 2>&1
          )"
          status="$?"
          set -e
          [[ "${status}" -eq 1 ]]
          expected="FreshTerminalAuditError: adoption bundle is not a directory"
          [[ "${output}" == *"${expected}"* ]]
          [[ "${output}" != *"terminal audit bootstrap rejected execution"* ]]
